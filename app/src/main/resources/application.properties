# Server
server.port=8080
spring.application.name=two-tier-app

# Database - configured via environment variables
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.env.enabled=true

# App info
info.app.name=Two-Tier Application
info.app.description=Spring Boot application connected to AWS RDS MySQL
info.app.version=1.0.0

# Logging
logging.level.com.shreik.twotierapp=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
