name: Build and Deploy Two-Tier Application

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: app/pom.xml

      - name: Build and test application
        working-directory: app
        run: mvn clean package

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "app/target/two-tier-app-1.0.0.jar"
          target: "/opt/two-tier-app/"

      - name: Restart application on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cp /opt/two-tier-app/two-tier-app-1.0.0.jar /opt/two-tier-app/two-tier-app.jar

            sudo systemctl restart two-tier-app

            sleep 15

            sudo systemctl status two-tier-app --no-pager